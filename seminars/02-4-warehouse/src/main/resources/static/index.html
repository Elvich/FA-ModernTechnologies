<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Склад техники</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><header><p>Семинар 2-4 · Вариант А–Е</p><h1>Склад магазина техники</h1><p>Учёт ввоза и вывоза оборудования</p></header>
<p id="message" role="status" aria-live="polite"></p>
<section><h2 id="form-title">Добавить технику</h2><form id="editor">
<label>Вид техники<input name="kind" required maxlength="200" placeholder="Ноутбук"></label>
<label>Группа техники<input name="equipmentGroup" required maxlength="200" placeholder="Компьютеры"></label>
<label>Дата ввоза<input name="importedOn" type="date" required></label>
<label>Дата вывоза<input name="exportedOn" type="date"></label>
<label>ФИО водителя<input name="driverName" required maxlength="200"></label>
<div class="actions"><button type="submit">Сохранить</button><button type="button" id="cancel" class="secondary">Сбросить</button></div>
</form></section>
<section><h2>Техника на складе и отгруженные записи</h2><form id="filters"><label>Поиск по всем полям<input name="q" placeholder="Вид, группа, водитель, дата или ID"></label><label>Сортировка по дате ввоза<select name="order"><option value="asc">Сначала ранние</option><option value="desc">Сначала поздние</option></select></label><button>Найти</button></form>
<p id="counter"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Вид</th><th>Группа</th><th>Ввоз</th><th>Вывоз</th><th>Водитель</th><th>Действия</th></tr></thead><tbody id="records"></tbody></table></div></section>
<section><h2>Отгрузки за 7 дней</h2><p>Все записи, независимо от поиска. По дате вывоза; сегодня и 6 предыдущих дней.</p><div id="histogram" aria-label="Количество отгруженной техники по дням"></div></section>
</main></body></html>
