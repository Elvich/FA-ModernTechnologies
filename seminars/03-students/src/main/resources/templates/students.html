<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт студентов</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/students.js" defer></script>
</head>
<body>
<main>
  <header><p class="eyebrow">Семинар · Spring Boot + JPA + Thymeleaf</p><h1>Учёт студентов</h1><p>Добавляйте студентов и редактируйте список.</p></header>
  <section aria-labelledby="form-title">
    <h2 id="form-title">Добавить студента</h2>
    <form id="student-form">
      <label>ID<input id="student-id" name="id" type="number" min="1" max="9007199254740991" required></label>
      <label>Имя<input name="firstName" maxlength="100" required></label>
      <label>Фамилия<input name="lastName" maxlength="100" required></label>
      <div class="actions"><button type="submit">Сохранить</button><button type="button" id="cancel" hidden>Отмена</button></div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
  <section aria-labelledby="list-title">
    <h2 id="list-title">Студенты</h2>
    <div class="table-wrap"><table>
      <thead><tr><th scope="col">ID</th><th scope="col">FirstName</th><th scope="col">LastName</th><th scope="col">Действия</th></tr></thead>
      <tbody>
      <tr th:each="student : ${students}">
        <td th:text="${student.id}">1</td><td th:text="${student.firstName}">Иван</td><td th:text="${student.lastName}">Иванов</td>
        <td class="actions"><button type="button" data-action="edit">Изменить</button><button type="button" data-action="delete">Удалить</button></td>
      </tr>
      <tr th:if="${#lists.isEmpty(students)}"><td colspan="4">Студентов пока нет. Добавьте первого через форму.</td></tr>
      </tbody>
    </table></div>
  </section>
</main>
</body>
</html>
